[project]
name = "insidethegame"
version = "0.1.0"
description = "Halfspace: an AI broadcast team and fan app for a synthetic football league (Microsoft Agent Framework + Foundry + MCP)"
readme = "README.md"
authors = [
    { name = "jeffyjohny7", email = "jeffyjohny07@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "agent-framework-core==1.22.0",
    "agent-framework-foundry==1.15.0",
    "azure-ai-projects>=2.3.0",
    "azure-identity>=1.26.0",
    "azure-monitor-opentelemetry>=1.8.10,<2",
    "mcp[cli]>=1.24,<2",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "pyarrow>=26.0.0",
]

[project.scripts]
insidethegame = "insidethegame:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
