<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Halfspace</title>
  <meta name="description" content="The Crown League: table, fixtures, stats, clubs and players, with the live match narrated by checked AI insights.">
  <link rel="preload" href="assets/fonts/anek-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="hub.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2311211B'/%3E%3Cpath d='M16 4v24M4 16h24' stroke='%23ECEAE0' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='6' fill='none' stroke='%23ECEAE0' stroke-width='2'/%3E%3C/svg%3E">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="topbar">
    <a class="brand" href="#/" aria-label="Halfspace home">
      <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 3v26M3 16h26" /><circle cx="16" cy="16" r="6" /></svg>
      <span>Halfspace</span>
    </a>
    <nav class="tabs" aria-label="Sections">
      <a href="#/" data-tab="home">Home</a>
      <a href="#/matches" data-tab="matches">Matches<i class="live-dot" id="navlive" hidden></i></a>
      <a href="#/table" data-tab="table">Table</a>
      <a href="#/stats" data-tab="stats">Stats</a>
      <a href="#/clubs" data-tab="clubs">Clubs</a>
      <a href="#/players" data-tab="players">Players</a>
      <a href="#/ask" data-tab="ask">Ask</a>
    </nav>
    <div class="top-ctrl">
      <button class="bell" id="bell" aria-label="Alerts" aria-expanded="false" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16V11a6 6 0 1 1 12 0v5l1.5 2h-15z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>
        <i class="bell-n" id="belln" hidden></i>
      </button>
      <a class="me-link" href="#/me" data-tab="me" id="melink" aria-label="My Halfspace"><span id="meinit">Me</span></a>
      <label class="season-pick" id="seasonpick" hidden><span class="sr-only">Season</span><select id="season"></select></label>
      <div class="segs style-pick" role="group" aria-label="Style">
        <button class="seg" data-hstyle="casual">Casual</button><button class="seg" data-hstyle="analyst">Analyst</button>
      </div>
    </div>
  </header>
  <div id="matchbar" hidden></div>
  <div class="tray" id="tray" hidden role="dialog" aria-label="Your alerts"></div>
  <main id="main" tabindex="-1">
    <p class="loading">Loading the league…</p>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
